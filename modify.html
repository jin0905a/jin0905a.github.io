<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>국군복지포털</title>

<style>
:root{
  --purple:#4b21ff;
  --accent:#6d65ff;
  --time-red:#e11d48;
  --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --scale:1;
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:#fff;
  font-family:var(--font);
  overflow:hidden;
}

.viewport{
  position:fixed;
  inset:0;
  padding:env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
  display:flex;
  justify-content:center;
  align-items:flex-start;
}

.fit{
  width:393px;
  transform:scale(var(--scale));
  transform-origin:top center;
  position:relative;
}

/* 카드 */
.card{
  position:relative;
  z-index:2;
  padding:10px 22px 0;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* 새로고침 */
.refresh{
  width:56px;
  height:56px;
  border-radius:50%;
  overflow:hidden;
}
.refresh img{
  width:100%;
  height:100%;
  object-fit:contain;
}
.refresh:active{opacity:.7}

/* 사진 */
.photo{
  margin-top:5px;
  width:131px;
  height:200px;
  object-fit:cover;
}

/* 이름 */
.name{
  margin-top:16px;
  font-size:24px;
  font-weight:400;
  letter-spacing:-0.4px;
}
.sub{
  margin-top:13px;              /* 🔥 간격 축소 */
  font-size:16px;
  font-weight:400;
}

/* 승인완료 */
.pill{
  margin-top:6px;             /* 🔥 더 가깝게 */
  width:280px;
  height:32px;
  background:var(--purple);
  color:#fff;
  border-radius:999px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:16px;
  font-weight:700;
  letter-spacing:-0.2px;
  box-shadow:0 2px 6px rgba(0,0,0,.08);
}

/* QR */
.qrWrap{
  margin-top:11px;
  width:70px;
  height:70px;
}
.qrWrap img{
  width:75px;
  height:75px;
}

/* 날짜/시간 */
.datetime{
  margin-top:7px;
  width:300px;
  text-align:center;
  font-size:18px;
  letter-spacing:-0.3px;
}
.datetime .date{font-weight:400;}
.datetime .time{
  font-weight:700;
  color:var(--time-red);
}

/* 마트/호텔 */
.bullets{
  margin-top:1px;              /* 🔥 날짜 바로 아래 */
  width:250px;
  color:var(--accent);
  font-size:22px;
  font-weight:700;
  line-height: 100%;
  text-align:left;
}
.item{
  display:flex;
  align-items:center;
  gap:10px;
  margin:12px 0;
}
.circle{
  width:8px;
  height:8px;
  border:1.8px solid var(--accent);
  border-radius:50%;
  text-align:left;
}
  .hidden-text{
  color:#fff;          /* 흰색 */
  font-size:0;         /* 화면에 안 보이게 */
  line-height:0;
}

/* 안내문 */
.note{
  margin-top:10px;
  font-size:16px;
  font-weight:500;
  color:var(--accent);
  text-align:center;
  line-height:1.4;
}

/* bottom – 화면 맨 아래 + 오른쪽 */
.bottom{
  /* position:absolute; */
  margin-top:19px;
   right:0;                   /* 🔥 오른쪽 */
  /* bottom:0;*/                    /* 🔥 최하단 */
   width:420px;  
  opacity:.7;
  mix-blend-mode:multiply;
  filter:contrast(1.5) brightness(.8);
  mask-image:linear-gradient(to top, black 60%, transparent 100%);
  pointer-events:none;
  animation:fade 2s ease-in-out infinite;
}
@keyframes fade{
  0%{opacity:.5}
  50%{opacity:0}
  100%{opacity:.5}
}
</style>
</head>

<body>
<div class="viewport">
  <div class="fit">

    <div class="card" id="card">

      <div class="refresh" onclick="location.reload()">
        <img src="new.jpg" alt="refresh">
      </div>

      <img src="box.jpg" class="photo">

      <div class="name">손진희</div>
      <div class="sub">손인기의 녀</div>

      <div class="pill">승인완료</div>

      <div class="qrWrap">
        <img src="qr.png">
      </div>

      <div class="datetime">
        <span class="date" id="date"></span>
        <span class="time" id="time"></span>
      </div>

      <div class="bullets">
        <div class="item"><span class="circle"></span>마트 이용 가능   <span class="hidden-text">추가</span>      </div>
        <div class="item"><span class="circle"></span>호텔콘도 이용 가능      </div>
      </div>

      <div class="note">
        국방복지 회원임을 증명합니다.<br>
        ※캡쳐된 화면은 사용이 불가능합니다.
      </div>

    </div>

    <!-- 🔥 bottom : 카드 밖 / 화면 맨 아래 / 오른쪽 -->
    <img src="bottom.png" class="bottom" alt="">

  </div>
</div>

<script>
function pad(n){return String(n).padStart(2,'0')}
function tick(){
  const d=new Date();
  date.textContent=`${d.getFullYear()}년 ${pad(d.getMonth()+1)}월 ${pad(d.getDate())}일 `;
  time.textContent=`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
tick(); setInterval(tick,1000);

function fit(){
  const h=card.scrollHeight;
  const vh=innerHeight;
  const s=Math.min(1,vh/h)*0.94;
  document.documentElement.style.setProperty('--scale',s);
}
onload=fit; onresize=fit;
</script>
</body>
</html>
